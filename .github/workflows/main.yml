name: Build iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-14   # 建议至少 macOS 14，Xcode 16 环境更稳

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Build Name
        id: buildname
        run: echo "name=$(date +'%Y-%m-%d')_Greenville" >> "$GITHUB_OUTPUT"

      - name: Install Godot
        id: godot
        run: |
          curl -L https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_macos.universal.zip -o godot.zip
          unzip -q godot.zip -d godot
          chmod +x godot/Godot.app/Contents/MacOS/Godot

      - name: Download Export Templates
        run: |
          curl -L https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz -o templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/
          unzip -q templates.tpz -d ~/Library/Application\ Support/Godot/export_templates/

      - name: Move iOS Export Template to Correct Directory
        run: |
          # Godot 4.6 的模板目录是 4.6.stable（点号），而不是 4.6-stable（连字符）
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.6.stable/
          mv ~/Library/Application\ Support/Godot/export_templates/templates/ios.zip \
             ~/Library/Application\ Support/Godot/export_templates/4.6.stable/ios.zip

      - name: Export Godot Project to Xcode Project
        run: |
          mkdir -p build/ios
          # iOS 导出必须产出 Xcode project 目录，而不是 .zip 压缩包
          # 并且 --headless 导出要求项目内已存在 iOS 的 export_presets.cfg（预设名必须与下面的 "iOS" 完全一致）
          ./godot/Godot.app/Contents/MacOS/Godot --headless --path . \
            --export-release "iOS" build/ios/ios_project.xcodeproj

      - name: Build Xcode Project (Unsigned)
        run: |
          xcodebuild archive \
            -project build/ios/ios_project.xcodeproj \
            -scheme ios_project \
            -sdk iphoneos \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/ios/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          cd build/ios
          mkdir -p Payload
          # .xcarchive 内的 .app 位于 Products/Applications/ 下
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -r ios_project.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.buildname.outputs.name }}
          path: build/ios/ios_project.ipa
          retention-days: 14
