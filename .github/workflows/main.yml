name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6-stable          # keep the dash here – matches the release tag
  GODOT_TEMPLATE_VERSION: 4.6.stable # dot here – matches the template folder name
  IOS_PRESET: iOS

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Generate Build Name
        id: buildname
        run: echo "name=$(date +'%Y-%m-%d')_Greenville" >> "$GITHUB_OUTPUT"

      # ── 1. Install Godot (headless) ──────────────────────────────
      - name: Install Godot
        run: |
          curl -L \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" \
            -o godot.zip
          unzip -q godot.zip -d godot
          chmod +x godot/Godot.app/Contents/MacOS/Godot

      # ── 2. Install iOS export template ────────────────────────────
      - name: Download Export Templates
        run: |
          curl -L \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            -o templates.tpz
          unzip -q templates.tpz -d templates_extracted

      - name: Move ios.zip to the correct Godot template directory
        run: |
          TEMPLATES_ROOT="$HOME/Library/Application Support/Godot/export_templates"
          mkdir -p "$TEMPLATES_ROOT/${GODOT_TEMPLATE_VERSION}"
          mv templates_extracted/templates/ios.zip \
             "$TEMPLATES_ROOT/${GODOT_TEMPLATE_VERSION}/ios.zip"
          # Optional: list the folder to verify placement
          ls -l "$TEMPLATES_ROOT/${GODOT_TEMPLATE_VERSION}"

      # ── 3. Export to an Xcode project (not a zip) ─────────────────
      #    The export preset **must** have:
      #      application/export_project_only = true
      #      application/delete_old_export_files_unconditionally = true
      #    (set them in the Godot editor → Export → Advanced Options)
      - name: Export Godot Project to Xcode
        run: |
          mkdir -p build
          ./godot/Godot.app/Contents/MacOS/Godot --headless --path . \
            --export-release "${IOS_PRESET}" build/ios_project.xcodeproj

      # ── 4. Build unsigned archive ────────────────────────────────
      - name: Build Xcode Project (Unsigned)
        run: |
          cd build
          xcodebuild archive \
            -project ios_project.xcodeproj \
            -scheme ios_project \
            -archivePath ios_project.xcarchive \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify   # or xcpretty, optional

      # ── 5. Package the IPA ──────────────────────────────────────
      - name: Package Unsigned IPA
        run: |
          cd build/ios_project.xcarchive/Products/Applications
          mkdir -p Payload
          mv *.app Payload/
          zip -r ../ios_project.ipa Payload

      # ── 6. Upload artifact ──────────────────────────────────────
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.buildname.outputs.name }}
          path: build/ios_project.xcarchive/Products/ios_project.ipa
          retention-days: 14
